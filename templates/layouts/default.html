<!DOCTYPE html>
<html lang="{site.data.lang ?: 'en'}" dir="{site.data.direction ?: 'ltr'}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Let's pass the page and site data to build title and seo meta (Roq built-in feature) -->
    {#seo page site /}

    <!-- This will get the favicon from the site data (or automatically if found) -->
    {#favicon site/}

    <!-- Light/Dark Theme initialization script (prevent flash) -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'light';
        if(theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- This will be adding all the scripts and styles bundled from the web/ directory -->
    {#bundle /}
</head>
<body>
    {#include partials/header.html /}

    <main class="site-main">
        {#insert /}
    </main>

    {#include partials/footer.html /}

</body>
</html>
